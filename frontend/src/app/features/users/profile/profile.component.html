<div class="profile-container">
  <div class="profile-card">
    <h2 class="profile-title">Mi Perfil</h2>
    
    <div *ngIf="loading" class="loading-spinner">
      <p>Cargando...</p>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" *ngIf="!loading" class="profile-form">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-control"
          readonly
        />
        <small class="form-hint">El nombre de usuario no se puede modificar</small>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.invalid]="isFieldInvalid('email')"
        />
        <small *ngIf="isFieldInvalid('email')" class="error-message">
          {{ getErrorMessage('email') }}
        </small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            class="form-control"
            [class.invalid]="isFieldInvalid('nombre')"
          />
          <small *ngIf="isFieldInvalid('nombre')" class="error-message">
            {{ getErrorMessage('nombre') }}
          </small>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido *</label>
          <input
            type="text"
            id="apellido"
            formControlName="apellido"
            class="form-control"
            [class.invalid]="isFieldInvalid('apellido')"
          />
          <small *ngIf="isFieldInvalid('apellido')" class="error-message">
            {{ getErrorMessage('apellido') }}
          </small>
        </div>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          formControlName="telefono"
          class="form-control"
          placeholder="Opcional"
        />
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading || profileForm.invalid"
        >
          {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </form>
  </div>
</div>
